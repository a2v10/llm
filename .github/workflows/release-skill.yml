name: Release skills

# Self-contained: uses no external `uses:` actions, so it is unaffected by the
# organization's "allowed actions" policy. git / gh / jq / zip are preinstalled
# on the GitHub-hosted runner.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (manual clone, no external actions)
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Read version from plugin.json
        id: meta
        run: |
          VERSION=$(jq -r '.version' plugins/a2v10-plugin/.claude-plugin/plugin.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read .version from plugin.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.meta.outputs.tag }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package skills
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          # One zip per skill: an upload accepts exactly one skill.
          for SRC in plugins/a2v10-plugin/skills/*/; do
            NAME=$(basename "$SRC")
            test -f "$SRC/SKILL.md" || { echo "::error::SKILL.md not found in $SRC"; exit 1; }
            # SKILL.md must be at the TOP LEVEL of the zip — pack the folder
            # contents, not the folder itself.
            ( cd "$SRC" && zip -r "$OUT/$NAME-$TAG.zip" . -x '*.gitignore' )
            echo "=== $NAME-$TAG.zip ==="
            unzip -l "$OUT/$NAME-$TAG.zip"
          done
          ls "$OUT"/*.zip >/dev/null 2>&1 || { echo "::error::No skills packaged"; exit 1; }

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release create "$TAG" "$GITHUB_WORKSPACE"/dist/*.zip \
            --target "${GITHUB_SHA}" \
            --title "A2v10 skills $TAG" \
            --notes "A2v10 skills $TAG — one zip per skill. Download the ones you need and add each via **Claude → Customize → Skills → + → Create skill → Upload a skill**."
